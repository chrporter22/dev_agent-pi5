# ============================================================
# REDIS CONFIG — redis/redis.conf
# Loaded by the redis container via entrypoint.sh.
# Per-service ACLs are loaded from /usr/local/etc/redis/users.acl
# (substituted at startup from users.acl.template).
# ============================================================

# Network — bind on all interfaces; compose network provides isolation.
bind 0.0.0.0
protected-mode no

# Disable persistence (job queue + cache only; data lives in tmpfs).
appendonly no
save ""

# ACL file (mounted read-only from host; entrypoint substitutes env vars).
aclfile /usr/local/etc/redis/users.acl

# Disable dangerous commands at the protocol level.
# Renaming to empty string makes them unavailable without removing
# the dispatcher entry — the redis server still allocates the slot.
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command DEBUG ""

# Logging.
loglevel notice
logfile ""
