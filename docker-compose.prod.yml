version: "3.9"

services:

  # ----------------------------------
  # INGRESS (ONLY PUBLIC ENTRYPOINT)
  # ----------------------------------
  pca-backend:
    build:
      context: ./core/pca-backend
    container_name: pca-backend
    ports:
      - "80:80"
    networks:
      - internal_net
      - outbound_net
    depends_on:
      - node-api
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    restart: unless-stopped

  # ----------------------------------
  # NODE API (READ-ONLY OVER REDIS)
  # ----------------------------------
  node-api:
    build:
      context: ./core/node-api
    container_name: node-api
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USER=nodeapi
      - REDIS_PASSWORD=${REDIS_PASSWORD_NODEAPI}
    expose:
      - "3000"
    networks:
      - internal_net
    depends_on:
      - redis
      - openclaw-ml
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 150
    restart: unless-stopped

  # ----------------------------------
  # BOT (TELEGRAM PRODUCER)
  # ----------------------------------
  openclaw-bot:
    build:
      context: ./core/bot
    image: openclaw/bot:${BOT_VERSION}
    container_name: openclaw-bot
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USER=bot
      - REDIS_PASSWORD=${REDIS_PASSWORD_BOT}
    networks:
      - internal_net
      - outbound_net
    depends_on:
      - redis
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
    restart: unless-stopped

  # ----------------------------------
  # WORKER (QUEUE CONSUMER → AI GATEWAY → GIT → PR)
  # ----------------------------------
  openclaw-worker:
    build:
      context: ./core/bot
    image: openclaw/bot:${BOT_VERSION}
    container_name: openclaw-worker
    command: ["python", "queue_worker.py"]
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USER=worker
      - REDIS_PASSWORD=${REDIS_PASSWORD_WORKER}
      - AI_GATEWAY_BASE_URL
      - AI_GATEWAY_API_KEY
      - AI_GATEWAY_MODEL
      - GITHUB_TOKEN
      - DEFAULT_REPO
      - SANDBOX_DIR=/sandbox
    networks:
      - internal_net
      - outbound_net
    depends_on:
      - redis
    read_only: true
    tmpfs:
      - /tmp
      - /sandbox
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ----------------------------------
  # REDIS (JOB QUEUE + CACHE, ACL-ISOLATED)
  # ----------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    entrypoint: /usr/local/etc/redis/entrypoint.sh
    env_file:
      - .env
    environment:
      - REDIS_PASSWORD_BOT
      - REDIS_PASSWORD_WORKER
      - REDIS_PASSWORD_ML
      - REDIS_PASSWORD_NODEAPI
    expose:
      - "6379"
    networks:
      - internal_net
    read_only: true
    tmpfs:
      - /data
      - /usr/local/etc/redis
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/users.acl.template:/usr/local/etc/redis/users.acl.template:ro
      - ./redis/entrypoint.sh:/usr/local/etc/redis/entrypoint.sh:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 50
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --user nodeapi --pass "$$REDIS_PASSWORD_NODEAPI" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------
  # ML WORKER (BACKGROUND ANALYTICS)
  # ----------------------------------
  openclaw-ml:
    build:
      context: ./core/ml
    container_name: openclaw-ml
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USER=ml
      - REDIS_PASSWORD=${REDIS_PASSWORD_ML}
      - PYTHONUNBUFFERED=1
    networks:
      - internal_net
    depends_on:
      - redis
    read_only: true
    tmpfs:
      - /tmp
      - /app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 150
    restart: unless-stopped

# ----------------------------------
# NETWORKS
# ----------------------------------
networks:
  internal_net:
    driver: bridge
    internal: true

  outbound_net:
    driver: bridge
