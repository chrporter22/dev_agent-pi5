name: Docker Build

description: Build and push a Docker image for a service in this repo

inputs:
  service:
    description: Service name (e.g. "bot", "ml", "node-api", "pca-backend", "redis")
    required: true
  context:
    description: Build context path (relative to repo root)
    required: true
  push:
    description: Whether to push the image
    required: false
    default: "false"
  tags:
    description: Comma-separated list of image tags
    required: true
  cache-from:
    description: Cache source (e.g. "type=gha")
    required: false
    default: "type=gha"
  cache-to:
    description: Cache destination (e.g. "type=gha,mode=max")
    required: false
    default: "type=gha,mode=max"

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
